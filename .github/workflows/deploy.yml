name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Build and qualify an image without accessing production
        type: boolean
        default: true
      reviewed_action:
        description: One reviewed v0.1.5 to v0.1.6 promotion
        type: choice
        options: [ordinary, prepare, promote]
        default: ordinary
      expected_sha:
        description: Exact current main SHA reviewed for preparation or promotion
        type: string
      prepared_run_id:
        description: Successful reviewed preparation run (promotion only)
        type: string
      prepared_attempt:
        description: Original preparation attempt (promotion only; reruns refused)
        type: string
      expected_proof_sha256:
        description: Reviewed proof SHA-256 printed by the preparation run
        type: string

permissions:
  contents: read

concurrency:
  group: meeting-production-release
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    name: Select verified source and version
    if: >-
      github.repository == 'leodotsinc/meeting-ai' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.already_released }}
      reviewed_source: ${{ steps.reviewed.outputs.proof }}
    steps:
      - name: Require current main and exact successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REF" == refs/heads/main ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$REQUEST_SHA" == "$main_sha" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REQUEST_SHA&status=success" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push")] | length' > ci-count.txt
          [[ $(cat ci-count.txt) -gt 0 ]]
          echo "sha=$REQUEST_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unqualified maintenance before ordinary deployment
        if: github.event_name != 'workflow_dispatch' || inputs.reviewed_action == 'ordinary'
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: python3 scripts/maintenance-guard.py
      - name: Authenticate the single reviewed promotion source
        id: reviewed
        if: github.event_name == 'workflow_dispatch' && inputs.reviewed_action != 'ordinary'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_ACTION: ${{ inputs.reviewed_action }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python3 scripts/reviewed-promotion.py source
      - name: Select SemVer from successful release tags
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select-release.py

  build:
    name: Build and qualify exact image
    needs: gate
    if: needs.gate.outputs.released != 'true' && inputs.reviewed_action != 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      APP_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --platform linux/amd64 --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg APP_REVISION="$RELEASE_SHA" --build-arg APP_BUILD_ID="$GITHUB_RUN_ID" \
            -t "$image" -f docker/Dockerfile .
          echo "$image" > image-tag.txt
      - name: Verify runtime, authentication boundary and drain
        if: inputs.reviewed_action != 'prepare'
        run: python3 scripts/qualify-image.py "$(cat image-tag.txt)"
      - name: Qualify baseline, candidate and rollback on isolated synthetic data
        if: inputs.reviewed_action == 'prepare'
        run: |
          set -euo pipefail
          baseline=$(python3 -c 'import json; print(json.load(open(".github/reviewed-promotion.json"))["baseline"]["image"])')
          docker pull --platform linux/amd64 "$baseline"
          python3 scripts/qualify-image.py "$(cat image-tag.txt)" \
            --baseline-image "$baseline" \
            --baseline-revision 99f2069dab3c652620e6ee7a48951c67009aa5e9 \
            --baseline-build-id 35489726673 --candidate-revision "$RELEASE_SHA" > functional-proof.json
      - name: Materialize builder image for development and build package coverage
        run: docker build --platform linux/amd64 --target builder -t meeting-ai-maintenance-builder:local -f docker/Dockerfile .
      - name: Materialize dependency-stage packages
        run: docker build --platform linux/amd64 --target deps -t meeting-ai-maintenance-deps:local -f docker/Dockerfile .
      - name: Bind security evidence to exact image identities
        id: maintenance_images
        run: |
          set -euo pipefail
          {
            echo "runtime=$(docker image inspect "$(cat image-tag.txt)" --format '{{.Id}}')"
            echo "deps=$(docker image inspect meeting-ai-maintenance-deps:local --format '{{.Id}}')"
            echo "builder=$(docker image inspect meeting-ai-maintenance-builder:local --format '{{.Id}}')"
          } >> "$GITHUB_OUTPUT"
      - name: Scan runtime image with fresh vulnerability database
        id: runtime_security
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.runtime }}
          output: maintenance-security/runtime
      - name: Scan build image and development dependencies
        if: ${{ !cancelled() && steps.maintenance_images.outcome == 'success' }}
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.builder }}
          output: maintenance-security/builder
      - name: Scan dependency stage including build-only OS packages
        if: ${{ !cancelled() && steps.maintenance_images.outcome == 'success' }}
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.deps }}
          output: maintenance-security/deps
      - name: Retain bounded sanitized security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meeting-ai-release-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: maintenance-security/**/security.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish qualified image and build manifest
        run: |
          set -euo pipefail
          image=$(cat image-tag.txt)
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          python3 scripts/release_manifest.py create \
            --service meeting-ai --compose-project meeting-ai --application-kind first_party \
            --app-version "$APP_VERSION" --release-version "$APP_VERSION" \
            --git-sha "$RELEASE_SHA" --image "$digest" --source-repository "https://github.com/$GITHUB_REPOSITORY" \
            --build-id "$GITHUB_RUN_ID" --build-attempt "$GITHUB_RUN_ATTEMPT" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release.json
      - name: Bind all evidence to the prepared image and original build attempt
        if: inputs.reviewed_action == 'prepare'
        env:
          REVIEWED_SOURCE: ${{ needs.gate.outputs.reviewed_source }}
          REVIEWED_ACTION: ${{ inputs.reviewed_action }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: |
          set -euo pipefail
          mkdir reviewed-bundle
          cp release.json functional-proof.json reviewed-bundle/
          for stage in runtime builder deps; do
            cp "maintenance-security/$stage/security.json" "reviewed-bundle/$stage-security.json"
          done
          python3 scripts/reviewed-promotion.py prepare
      - name: Retain the immutable reviewed preparation bundle
        if: inputs.reviewed_action == 'prepare'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meeting-reviewed-${{ github.run_id }}-${{ github.run_attempt }}
          path: reviewed-bundle/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Identify this build attempt
        id: artifact
        run: echo "name=meeting-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release.json
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Verify and reuse the reviewed prepared image
    needs: gate
    if: github.event_name == 'workflow_dispatch' && inputs.reviewed_action == 'promote' && needs.gate.outputs.released != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify origin, current main, baseline, artifact digest and all proofs
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_ACTION: ${{ inputs.reviewed_action }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          PREPARED_ATTEMPT: ${{ inputs.prepared_attempt }}
          EXPECTED_PROOF_SHA256: ${{ inputs.expected_proof_sha256 }}
        run: python3 scripts/reviewed-promotion.py promote
      - name: Identify this transport attempt
        id: artifact
        run: echo "name=meeting-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Copy the verified original manifest for the existing transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: release.json
          if-no-files-found: error
          retention-days: 30

  rollout:
    if: >-
      always() && !cancelled() && needs.gate.result == 'success' &&
      ((needs.build.result == 'success' && inputs.reviewed_action != 'promote' &&
        (github.event_name != 'workflow_dispatch' || inputs.prepare_only == false)) ||
       (needs.promote.result == 'success' && inputs.reviewed_action == 'promote'))
    name: Backup, preflight and controlled rollout
    needs: [gate, build, promote]
    permissions:
      contents: read
      packages: read
    uses: leodotsinc/.github/.github/workflows/deploy.yml@247880b24e80ab791b9e2e82dd33ccad7981c053
    with:
      app_id: meeting-ai
      release_artifact: ${{ needs.promote.outputs.artifact_name || needs.build.outputs.artifact_name }}
      release_file: release.json
      release_sha: ${{ needs.gate.outputs.sha }}
      vps_host: ${{ vars.VPS_IP }}
      ssh_port: ${{ vars.SSH_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
    secrets:
      deploy_key: ${{ secrets.MEETING_DEPLOY_KEY }}
      known_hosts: ${{ secrets.MEETING_SSH_KNOWN_HOSTS }}

  publish:
    name: Publish verified Meeting release
    needs: [gate, rollout]
    if: always() && needs.gate.result == 'success' && needs.rollout.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      APP_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rollout.outputs.result_artifact }}
      - name: Extract and validate verified release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("deployment-result.json").read_text())
          if result.get("ok") is not True or result.get("release", {}).get("deployment", {}).get("status") != "verified":
              raise SystemExit("deployment result is not verified")
          Path("deployed-release.json").write_text(json.dumps(result["release"], indent=2) + "\n")
          PY
      - name: Publish version only after verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py deployed-release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: meeting-deployed-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployed-release.json
          if-no-files-found: ignore
          retention-days: 90
