name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meeting-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-qualification:
    name: Dependency source proof
    if: github.event_name == 'pull_request' && github.event.pull_request.user.id == 29139614
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # This runner never installs or executes candidate application code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require bootstrapped trusted producer
        id: bootstrap
        run: |
          if test -f scripts/maintenance-source-proof.py; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'SOURCE_PROOF_NOT_BOOTSTRAPPED; no qualification artifact'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.bootstrap.outputs.ready == 'true'
        with:
          node-version: '26'
      - name: Install only pinned maintenance tools
        if: steps.bootstrap.outputs.ready == 'true'
        run: npm ci --prefix scripts/maintenance-tools --ignore-scripts --no-audit --no-fund
      - name: Qualify immutable dependency source
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/maintenance-source-proof.py source-qualification.json
      - name: Build disposable tool inventory
        if: steps.bootstrap.outputs.ready == 'true'
        id: tool-image
        run: |
          docker build -t meeting-maintenance-tools:ci scripts/maintenance-tools
          echo "image=$(docker image inspect meeting-maintenance-tools:ci --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          npm sbom --prefix scripts/maintenance-tools --sbom-format=cyclonedx > maintenance-tools.cdx.json
      - name: Scan pinned maintenance tool and base
        if: steps.tool-image.outcome == 'success'
        uses: leodotsinc/.github/actions/maintenance-scan@e9cee15fd693c658200128c127175f6e5d239838
        with:
          image: ${{ steps.tool-image.outputs.image }}
          output: maintenance-tools-security
      - name: Retain source classification
        if: ${{ !cancelled() && hashFiles('source-qualification.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meeting-ai-source-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-qualification.json
          retention-days: 45
          if-no-files-found: error
      - name: Retain tool inventory and scan
        if: ${{ !cancelled() && steps.tool-image.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: meeting-ai-maintenance-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            maintenance-tools.cdx.json
            maintenance-tools-security/security.json
          retention-days: 7
          if-no-files-found: error

  qualify:
    name: Tests, migrations and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_fixture_only
          POSTGRES_DB: meeting_migrations_ci_actions
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin -d meeting_migrations_ci_actions"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci_admin:ci_fixture_only@127.0.0.1:5432/meeting_migrations_ci_actions
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --test tests/*.test.mjs scripts/migration-check.test.mjs
      - run: npm ci --prefix scripts/maintenance-tools --ignore-scripts --no-audit --no-fund
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node scripts/qualify-migrations.mjs
      - run: npm run build
      - run: npx tsc --noEmit

  image-qualify:
    name: Exact image, authentication and safe migration bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated qualification image
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg APP_VERSION=0.1.0 \
            --build-arg APP_REVISION="$REVISION" --build-arg APP_BUILD_ID="$GITHUB_RUN_ID" \
            -t meeting-ai:ci-qualification -f docker/Dockerfile .
      - name: Qualify runtime and read-only migration commands
        run: python3 scripts/qualify-image.py meeting-ai:ci-qualification > meeting-data-qualification.json
      - name: Materialize builder image for development and build package coverage
        run: docker build --platform linux/amd64 --target builder -t meeting-ai-maintenance-builder:local -f docker/Dockerfile .
      - name: Materialize dependency-stage packages
        run: docker build --platform linux/amd64 --target deps -t meeting-ai-maintenance-deps:local -f docker/Dockerfile .
      - name: Bind security evidence to exact image identities
        id: maintenance_images
        run: |
          set -euo pipefail
          echo "runtime=$(docker image inspect meeting-ai:ci-qualification --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "deps=$(docker image inspect meeting-ai-maintenance-deps:local --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "builder=$(docker image inspect meeting-ai-maintenance-builder:local --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Scan runtime image with fresh vulnerability database
        id: runtime_security
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.runtime }}
          output: maintenance-security/runtime
      - name: Scan build image and development dependencies
        if: ${{ !cancelled() && steps.maintenance_images.outcome == 'success' }}
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.builder }}
          output: maintenance-security/builder
      - name: Scan dependency stage including build-only OS packages
        if: ${{ !cancelled() && steps.maintenance_images.outcome == 'success' }}
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.deps }}
          output: maintenance-security/deps
      - name: Retain bounded sanitized security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meeting-ai-review-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: maintenance-security/**/security.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain synthetic data qualification proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meeting-ai-data-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: meeting-data-qualification.json
          if-no-files-found: error
          retention-days: 7
